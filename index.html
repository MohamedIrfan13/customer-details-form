
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Details Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>Customer & Shipment Information Form</h2>

        <form action="send.php" method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Party Name</label>
                    <input type="text" name="party_name"
                    placeholder="Enter Party name" required>
                </div>

                <div class="form-group">
                    <label>Party Roles</label>
                    <input type="text" name="party_roles"
                    placeholder="Enter Party Roles" required>
                </div>

                <div class="form-group">
                    <label>Contact Person</label>
                    <input type="text" name="contact_person"
                    placeholder="Enter Contact Person" required>
                </div>

                <div class="form-group">
                    <label>City</label>
                    <input type="text" name="city"
                    placeholder="Enter City" required>
                </div>

                <div class="form-group">
                    <label>P.O. Box</label>
                    <input type="text" name="po_box" required>
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" name="phone"
                    placeholder="Enter Phone Number" required>
                </div>

                <div class="form-group">
                    <label>Fax</label>
                    <input type="text" name="fax"
                    placeholder="Enter Fax" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="customer_email"
                    placeholder="Enter Email" required>
                </div>

                <div class="form-group">
                    <label>Country</label>
                    <input type="text" name="country" required>
                </div>

                <div class="form-group">
                    <label>Customer Code</label>
                    <input type="text" name="customer_code" required>
                </div>

                <div class="form-group">
                    <label>CR No</label>
                    <input type="text" name="cr_no"
                    placeholder="CR No*" required>
                </div>

            </div>

            <button type="submit">Submit</button>

        </form>

    </div>

</body>
</html>
